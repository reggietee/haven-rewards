<svg viewBox="0 0 396 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Story Mode — Tri-spiral signal mark + spaced caps wordmark (dark variant) -->

  <!-- Signal mark centered at 48,48 -->
  <g transform="translate(48,48)">
    <!-- Origin node -->
    <circle cx="0" cy="0" r="5" fill="#D42020"/>

    <!-- Inner ring — r=22, three 120° arcs with progressive fade -->
    <path d="M0,-22 A22,22 0 0,1 19.05,11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M19.05,11 A22,22 0 0,1 -19.05,11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M-19.05,11 A22,22 0 0,1 0,-22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>

    <!-- Outer ring — r=40, three 120° arcs with progressive fade -->
    <path d="M0,-40 A40,40 0 0,1 34.64,20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M34.64,20 A40,40 0 0,1 -34.64,20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M-34.64,20 A40,40 0 0,1 0,-40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Wordmark -->
  <text x="106" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff" letter-spacing="5">STORY MODE</text>
</svg>
